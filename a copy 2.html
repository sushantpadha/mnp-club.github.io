    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.5.0/p5.min.js"></script>
    <script>
      // Floating equations canvas
      const canvas = document.getElementById('equationCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const equations = ['∫', '∑', 'Γ', 'π', 'α', 'δ', 'eˣ', 'dx', '∂', '√', '∞', 'θ'];
      const particles = [];

      class Particle {
        constructor() {
          this.reset();
          this.symbol = equations[Math.floor(Math.random() * equations.length)];
          this.fontSize = 20 + Math.random() * 20;
        }

        reset() {
          this.x = Math.random() * canvas.width;
          this.y = canvas.height + Math.random() * 200;
          this.speed = 0.3 + Math.random() * 0.7;
          this.opacity = 0.2 + Math.random() * 0.6;
        }

        update() {
          this.y -= this.speed;
          if (this.y < -50) this.reset();
        }

        draw() {
          ctx.font = `${this.fontSize}px serif`;
          ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
          ctx.fillText(this.symbol, this.x, this.y);
        }
      }

      for (let i = 0; i < 50; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p) => {
          p.update();
          p.draw();
        });
        requestAnimationFrame(animate);
      }
      animate();

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    </script>

    <script>
      // p5.js sketch for pendulum
      let angle = Math.PI / 4;
      let aVelocity = 0;
      let aAcceleration = 0;
      let length = 200;
      let origin;
      let bob;

      new p5((sketch) => {
        sketch.setup = () => {
          const canvas = sketch.createCanvas(600, 300);
          canvas.parent('pendulum-sketch');
          origin = sketch.createVector(sketch.width / 2, 0);
          bob = sketch.createVector();
        };

        sketch.draw = () => {
          sketch.background(20);
          let gravity = 0.4;
          aAcceleration = (-1 * gravity / length) * Math.sin(angle);
          aVelocity += aAcceleration;
          angle += aVelocity;
          aVelocity *= 0.99;

          bob.set(
            origin.x + length * Math.sin(angle),
            origin.y + length * Math.cos(angle)
          );

          sketch.stroke(255);
          sketch.line(origin.x, origin.y, bob.x, bob.y);
          sketch.fill(255);
          sketch.ellipse(bob.x, bob.y, 40, 40);
        };
      });
    </script>
